<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What our clients say | Slatout</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF8F5;--ink:#11141D;--ink-2:#4B5160;--ink-3:#868B97;--line:rgba(17,20,29,.1);
  --brand:#FF6A13;--brand-d:#D9520A;
  --sans:"Inter Tight",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.22,.8,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:clip}
p,h2,h3,ul,blockquote,figure,dl,dd{margin:0}
ul{padding:0;list-style:none}
a{color:inherit}
.demo{height:40vh;display:grid;place-items:center;font:500 .72rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#B2AEB8}

.rv{padding:clamp(72px,9vw,128px) 0 clamp(64px,8vw,110px);overflow-x:clip}
.wrap{width:min(1180px,100% - 2*clamp(16px,4vw,48px));margin-inline:auto}
.fade{opacity:0;transform:translateY(16px);transition:opacity .9s var(--ease),transform 1s var(--ease)}.fade.in{opacity:1;transform:none}

/* heading */
.hd{text-align:center;max-width:46rem;margin-inline:auto}
.k{display:inline-flex;align-items:center;gap:10px;margin-bottom:20px;font:500 .72rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.k::before,.k::after{content:"";width:22px;height:2px;border-radius:2px;background:var(--brand)}
.hd h2{font-weight:800;font-size:clamp(2.4rem,5.6vw,4.4rem);line-height:1;letter-spacing:-.05em}
.hd p{margin-top:18px;color:var(--ink-2);font-size:clamp(1rem,1.3vw,1.15rem);text-wrap:balance}
.smp{display:inline-block;margin-top:18px;padding:6px 12px;border-radius:999px;border:1px dashed rgba(17,20,29,.3);font:500 .62rem/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

/* avatar index */
.tabs{display:flex;justify-content:center;align-items:center;gap:clamp(10px,2vw,22px);margin:clamp(32px,4vw,48px) 0 clamp(24px,3vw,36px);min-height:84px}
.tb{all:unset;cursor:pointer;border-radius:50%}
.av{display:grid;place-items:center;overflow:hidden;width:var(--w,56px);aspect-ratio:1;border-radius:50%;background:var(--t);color:var(--d)}
.av svg{width:52%;height:52%}
.av img{width:100%;height:100%;object-fit:cover}
.tb .av{--w:52px;opacity:.55;filter:saturate(.7);transition:width .5s var(--ease),opacity .4s,filter .4s,box-shadow .4s}
.tb:hover .av{opacity:.9}
.tb[aria-selected=true] .av{--w:72px;opacity:1;filter:none;box-shadow:0 0 0 3px var(--paper),0 0 0 5.5px var(--brand)}
.tb:focus-visible{outline:2px solid var(--ink);outline-offset:6px}

/* carousel */
.vp{position:relative;overflow:hidden;padding:18px 0 34px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
.trk{display:flex;gap:28px;will-change:transform}
.trk.go{transition:transform .8s var(--ease)}
.sl{flex:none;width:min(900px,86vw);display:grid;grid-template-columns:minmax(0,.36fr) minmax(0,.64fr);border-radius:30px;background:#fff;
  box-shadow:inset 0 0 0 1.5px rgba(255,106,19,.5),0 30px 60px -34px rgba(255,106,19,.45);opacity:.34;transform:scale(.93);filter:blur(1.5px);cursor:pointer;
  transition:opacity .6s,transform .7s var(--ease),filter .6s}
.sl.on{opacity:1;transform:none;filter:none;cursor:default}

/* left: the project, in facts */
.pj{display:flex;flex-direction:column;gap:20px;margin:14px;padding:clamp(18px,2.2vw,28px);border-radius:20px;background:var(--paper)}
.pj dt{display:flex;align-items:center;gap:8px;margin-bottom:8px;font:500 .64rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.pj dt::before{content:"";width:10px;height:2px;border-radius:2px;background:var(--brand)}
.pj dd{font-weight:600;font-size:.98rem;line-height:1.35;letter-spacing:-.015em}
.pj .res dd{font-weight:700;font-size:1.06rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px 0 10px;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);font:500 .66rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--ink);transition:background .25s,box-shadow .25s}
.chip i{width:8px;height:8px;border-radius:2px;background:var(--d)}
.chip:hover,.chip:focus-visible{background:var(--t);box-shadow:inset 0 0 0 1px var(--d)}
.chip:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* right: the person and what they said */
.rd{display:flex;flex-direction:column;gap:clamp(18px,2vw,26px);padding:clamp(24px,3vw,40px) clamp(24px,3vw,44px) clamp(24px,3vw,38px) clamp(10px,1.4vw,22px);min-width:0}
.pp{display:flex;align-items:center;gap:16px}
.pp .av{--w:58px;flex:none}
.pp .nm{min-width:0}
.pp b{display:block;font-weight:700;font-size:1.15rem;line-height:1.2;letter-spacing:-.025em}
.pp .nm span{display:block;font-size:.92rem;color:var(--ink-2)}
.perm{margin-left:auto;display:inline-flex;align-items:center;gap:7px;padding:7px 11px 7px 8px;border-radius:999px;background:#F2F8F4;color:#1B6B45;font:500 .6rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.perm svg{width:13px;height:13px}
.rt{display:flex;align-items:center;gap:12px}
.stars{display:inline-flex;gap:3px;color:var(--brand)}.stars svg{width:18px;height:18px}.stars .off{color:#E3DFD8}
.rt b{font:700 .78rem var(--mono);letter-spacing:.06em}
.q{font-weight:500;font-size:clamp(1.2rem,1.9vw,1.6rem);line-height:1.38;letter-spacing:-.022em;text-wrap:pretty}
.q mark{background:linear-gradient(transparent 64%,rgba(255,106,19,.28) 64%);color:inherit;font-weight:700;padding:0 .08em}

/* controls */
.ctl{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:6px}
.ar{all:unset;cursor:pointer;display:grid;place-items:center;width:54px;height:54px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1.5px rgba(17,20,29,.14);transition:background .3s,color .3s,box-shadow .3s}
.ar svg{width:20px;height:20px}
.ar:hover{background:var(--ink);color:#fff;box-shadow:none}
.ar:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
.cn{min-width:120px;text-align:center;font:500 .72rem var(--mono);letter-spacing:.12em;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cn b{color:var(--ink);font-weight:700}
.prog{height:2px;margin:10px auto 0;width:84px;border-radius:2px;background:rgba(17,20,29,.1);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--brand)}
.prog i.run{animation:crp 9s linear forwards}
.prog.hold i.run{animation-play-state:paused}
@keyframes crp{to{width:100%}}

@media(max-width:760px){
  .sl{grid-template-columns:1fr;width:88vw}
  .rd{order:-1;padding:24px 22px 8px}
  .pj{margin:8px 14px 14px;padding:20px}
  .perm{margin-left:0}.pp{flex-wrap:wrap}
  .tb .av{--w:40px}.tb[aria-selected=true] .av{--w:56px}.tabs{gap:8px;min-height:66px}
    .ar{width:48px;height:48px}.ctl{gap:12px}.cn{min-width:92px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.fade{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="demo" id="top">&uarr; the section above</div>

<section class="rv" id="reviews" aria-labelledby="rv-h">
 <div class="wrap">
  <div class="hd fade">
    <p class="k">Client reviews</p>
    <h2 id="rv-h">What our clients say</h2>
    <p>Founders and business owners on working with one team across setup, build, growth and finance, with one plan and one point of contact.</p>
    <span class="smp">Sample content &middot; replace with real, permitted reviews</span>
  </div>

  <div class="tabs fade" id="tabs" role="tablist" aria-label="Choose a review"></div>

  <div class="vp fade" id="vp" aria-roledescription="carousel" aria-label="Client reviews">
    <div class="trk" id="trk" aria-live="polite"></div>
  </div>

  <div class="fade">
    <div class="ctl">
      <button class="ar" id="prev" type="button" aria-label="Previous review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m6-6-6 6 6 6"/></svg></button>
      <span class="cn" id="cn" aria-hidden="true"></span>
      <button class="ar" id="next" type="button" aria-label="Next review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
    </div>
    <div class="prog" id="prog" aria-hidden="true"><i id="pi"></i></div>
  </div>
 </div>
</section>

<div class="demo">the section below &darr;</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); }, two = function (n) { return ('0' + n).slice(-2); };
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* service: [slug, name, tint, deep] */
  var SV = {
    setup: ['business-setup-registration', 'Business Setup', '#E3EEDC', '#2E5B34'], tech: ['technology-ai-solutions', 'Technology & AI', '#E2E6FF', '#3140A3'],
    offline: ['offline-business-launch', 'Offline Launch', '#F4EAD8', '#6E5320'], brand: ['branding-marketing', 'Branding', '#FBE1E6', '#A1324C'],
    content: ['content-strategy', 'Content Strategy', '#FFF3CC', '#7A5900'], digital: ['digital-marketing', 'Digital Marketing', '#D8F2EA', '#126B5A'],
    market: ['ecommerce-marketplace-growth', 'Marketplaces', '#EDE3FB', '#5C3C9F'], prog: ['programmatic-advertising', 'Programmatic Ads', '#DDEFFB', '#175C88'],
    bd: ['business-development-outsourcing', 'BD Outsourcing', '#FFE6D1', '#A2470F'], fin: ['finance-tax-compliance', 'Finance & Tax', '#DDEDEC', '#24555A'] };

  /* SAMPLE CONTENT (names are placeholders, not real clients). Replace every field with real reviews the client has agreed to share.
     photo (optional): add "photo:'/img/name.jpg'" to show a real portrait instead of the placeholder icon. hl = phrase to highlight in q. */
  var R = [
    { name: 'Meera Nambiar', role: 'Founder', biz: 'Packaged-food startup', industry: 'Food & beverage', rooms: ['setup', 'brand', 'market'], rate: 5,
      q: 'I used to chase five different vendors for one launch. Now there is one team, one plan, and I always know what happens next.', hl: 'one team, one plan',
      came: 'A product ready to sell, but no company, brand or sales channel.', left: 'A registered business, a brand identity and a live online store.' },
    { name: 'Arjun Deshpande', role: 'Owner', biz: 'Multi-clinic healthcare practice', industry: 'Healthcare', rooms: ['offline', 'digital'], rate: 5,
      q: 'The opening felt organised instead of chaotic, and the enquiries started arriving before we had even cut the ribbon.', hl: 'organised instead of chaotic',
      came: 'A new location opening in six weeks with nothing ready.', left: 'A launch plan, local marketing and a steady stream of enquiries.' },
    { name: 'Kavya Reddy', role: 'Director', biz: 'B2B manufacturing company', industry: 'Manufacturing', rooms: ['bd', 'content'], rate: 5,
      q: 'Our sales team now spends its time in conversations, not on research. The pipeline finally looks like something we can plan around.', hl: 'conversations, not on research',
      came: 'Prospecting that happened in bursts, whenever the team had time.', left: 'A target-account list, weekly outreach and a tracked pipeline.' },
    { name: 'Rohan Malhotra', role: 'Co-founder', biz: 'SaaS startup', industry: 'Software', rooms: ['tech', 'brand', 'prog'], rate: 5,
      q: 'They asked about the business problem before they mentioned a single tool. That one habit saved us months.', hl: 'business problem before they mentioned a single tool',
      came: 'A product idea, a long feature list and no clear order of work.', left: 'A scoped build, a matching brand and campaigns ready to go.' },
    { name: 'Farhan Qureshi', role: 'Owner', biz: 'Retail brand, three stores', industry: 'Retail', rooms: ['offline', 'brand', 'fin'], rate: 5,
      q: 'Accounts, branding and store openings used to sit in different inboxes. Having them in one place changed how calmly I run the business.', hl: 'in one place',
      came: 'Three stores, three sets of paperwork and no common brand.', left: 'A consistent brand, clean books and a compliance calendar.' },
    { name: 'Ananya Bhattacharya', role: 'Founder', biz: 'Professional services firm', industry: 'Professional services', rooms: ['fin', 'setup'], rate: 5,
      q: 'Clear scope, clear timelines and no surprises. I did not have to learn the rules, I just had to answer their questions.', hl: 'no surprises',
      came: 'A growing practice with an informal structure and untidy filings.', left: 'The right entity, registrations in order and monthly finance routines.' }
  ];
  var N = R.length, cur = 0, playing = true, started = false;
  var trk = $('trk'), vp = $('vp'), pi = $('pi');
  var USER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.6-3.6 3.4-5.6 7-5.6s6.4 2 7 5.6"/></svg>';
  var STAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2.8 2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8L12 2.8Z"/></svg>';
  var esc = function (s) { return s.replace(/&/g, '&amp;'); };
  function av(r, w) { var s = SV[r.rooms[0]]; return '<span class="av" style="--w:' + w + 'px;--t:' + s[2] + ';--d:' + s[3] + '">' + (r.photo ? '<img src="' + r.photo + '" alt="">' : USER) + '</span>'; }

  $('tabs').innerHTML = R.map(function (r, i) {
    return '<button class="tb" role="tab" id="t' + i + '" type="button" aria-selected="false" tabindex="-1" aria-label="' + r.role + ', ' + r.biz + '" data-i="' + i + '">' + av(r, 52) + '</button>';
  }).join('');
  var tabs = [].slice.call(document.querySelectorAll('.tb'));

  trk.innerHTML = R.map(function (r, i) {
    var chips = r.rooms.map(function (k) { var s = SV[k]; return '<a class="chip" href="/services/' + s[0] + '/" style="--t:' + s[2] + ';--d:' + s[3] + '"><i></i>' + esc(s[1]) + '</a>'; }).join('');
    var st = ''; for (var n = 1; n <= 5; n++) st += n <= r.rate ? STAR : STAR.replace('<svg', '<svg class="off"');
    return '<article class="sl" data-i="' + i + '" aria-label="Review ' + (i + 1) + ' of ' + N + '">' +
      '<dl class="pj"><div><dt>Industry</dt><dd>' + r.industry + '</dd></div>' +
      '<div><dt>Services used</dt><dd class="chips">' + chips + '</dd></div>' +
      '<div><dt>Came with</dt><dd>' + r.came + '</dd></div>' +
      '<div class="res"><dt>Left with</dt><dd>' + r.left + '</dd></div></dl>' +
      '<div class="rd"><div class="pp">' + av(r, 58) + '<div class="nm"><b>' + r.name + '</b><span>' + r.role + ', ' + r.biz + '</span></div>' +
      '<span class="perm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>Shown with permission</span></div>' +
      '<div class="rt"><span class="stars" role="img" aria-label="' + r.rate + ' out of 5">' + st + '</span><b>' + r.rate + '.0</b></div>' +
      '<blockquote class="q">“' + r.q.replace(r.hl, '<mark>' + r.hl + '</mark>') + '”</blockquote>' +
      '</div></article>';
  }).join('');
  var sls = [].slice.call(trk.children);

  function place(anim) {
    var W = sls[0].offsetWidth, G = 28;
    trk.classList.toggle('go', !!anim && !reduce);
    trk.style.transform = 'translateX(' + (vp.clientWidth / 2 - W / 2 - cur * (W + G)) + 'px)';
  }
  function runBar() { pi.classList.remove('run'); pi.style.width = '0'; void pi.offsetWidth; if (playing && started && !reduce) pi.classList.add('run'); }
  function show(i, byUser, first) {
    i = (i + N) % N; if (i === cur && !first) return; cur = i;
    sls.forEach(function (s, k) {
      var on = k === i; s.classList.toggle('on', on); s.setAttribute('aria-hidden', !on);
      [].forEach.call(s.querySelectorAll('a'), function (a) { a.tabIndex = on ? 0 : -1; });
    });
    tabs.forEach(function (t, k) { var on = k === i; t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1; });
    $('cn').innerHTML = '<b>' + two(i + 1) + '</b> / ' + two(N);
    place(!first);
    if (byUser) { playing = false; pi.classList.remove('run'); pi.style.width = '0'; } else runBar();
  }
  pi.addEventListener('animationend', function () { if (playing) show(cur + 1, false); });
  tabs.forEach(function (t) { t.addEventListener('click', function () { show(+t.getAttribute('data-i'), true); }); });
  $('tabs').addEventListener('keydown', function (e) {
    var k = e.key, to = -1;
    if (k === 'ArrowRight') to = cur + 1; else if (k === 'ArrowLeft') to = cur - 1; else if (k === 'Home') to = 0; else if (k === 'End') to = N - 1;
    if (to < 0) return; e.preventDefault(); show(to, true); tabs[(to + N) % N].focus();
  });
  $('prev').addEventListener('click', function () { show(cur - 1, true); });
  $('next').addEventListener('click', function () { show(cur + 1, true); });
  sls.forEach(function (s, k) { s.addEventListener('click', function (e) { if (k !== cur) { e.preventDefault(); show(k, true); } }); });

  var sec = $('reviews');
  ['pointerenter', 'focusin'].forEach(function (t) { sec.addEventListener(t, function () { $('prog').classList.add('hold'); }); });
  ['pointerleave', 'focusout'].forEach(function (t) { sec.addEventListener(t, function () { $('prog').classList.remove('hold'); }); });
  var sx = null;
  vp.addEventListener('pointerdown', function (e) { if (e.pointerType !== 'mouse') sx = e.clientX; });
  vp.addEventListener('pointerup', function (e) { if (sx === null) return; var d = e.clientX - sx; sx = null; if (Math.abs(d) > 60) show(cur + (d < 0 ? 1 : -1), true); });
  addEventListener('resize', function () { place(false); });

  show(0, false, true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { place(false); });
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (x) { if (!x.isIntersecting) return; x.target.classList.add('in'); if (x.target === vp) { started = true; runBar(); } io.unobserve(x.target); });
  }, { threshold: .3 });
  [].forEach.call(document.querySelectorAll('.fade'), function (x, i) { x.style.transitionDelay = (i % 3) * 80 + 'ms'; io.observe(x); });
})();
</script>
</body>
</html>
